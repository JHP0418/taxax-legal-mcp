[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "taxax-legal-mcp"
version = "0.2.11"
description = "Korean tax-law source lookup and citation verification MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.12,<3",
  "PyJWT[crypto]>=2.13,<3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2"]
# PyInstaller가 mcp 패키지의 하위 모듈을 훑을 때 mcp의 CLI 경로까지 import를
# 시도하므로, 그 선택적 의존성인 typer가 없으면 수집 단계에서 실패한다.
windows = ["pyinstaller>=6.11,<7", "typer>=0.12,<0.20"]

[project.scripts]
taxax-legal = "taxax.legal.cli:main"
taxax-legal-mcp = "taxax.mcp.server:main"
taxax-legal-setup = "taxax.legal.windows_setup:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["taxax.legal", "taxax.legal.providers", "taxax.mcp"]
include-package-data = false
